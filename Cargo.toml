[workspace]
resolver = "2"
members = ["crates/ferrite-core", "crates/ferrite-ui", "crates/ferrite-app", "crates/ferrite-store", "crates/ferrite-checks", "crates/ferrite-radio", "firmware", "reader", "restorer", "sim", "sim-web", "drivers/bus", "drivers/bk4829", "drivers/si4732", "drivers/st7789", "drivers/w25q", "drivers/keypad", "drivers/nmea", "digimodes/udsp", "digimodes/ufx25", "digimodes/uafsk", "digimodes/upocsag", "digimodes/udsc", "digimodes/uaprs"]
# Plain `cargo test` / `cargo clippy` cover what runs on the PC; the firmware builds with `cargo fw` (radio only).
default-members = ["crates/ferrite-core", "crates/ferrite-ui", "crates/ferrite-app", "crates/ferrite-store", "crates/ferrite-checks", "crates/ferrite-radio", "sim", "drivers/bus", "drivers/bk4829", "drivers/si4732", "drivers/st7789", "drivers/w25q", "drivers/keypad", "drivers/nmea", "digimodes/udsp", "digimodes/ufx25", "digimodes/uafsk", "digimodes/upocsag", "digimodes/udsc", "digimodes/uaprs"]

[workspace.package]
version = "0.9.4-beta.3"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/FerriteFW/ferrite"
publish = false

[workspace.dependencies]
ferrite-core = { path = "crates/ferrite-core" }
ferrite-ui = { path = "crates/ferrite-ui" }
ferrite-app = { path = "crates/ferrite-app", default-features = false } # the vt100 pages: each user says
ferrite-store = { path = "crates/ferrite-store", default-features = false }
ferrite-radio = { path = "crates/ferrite-radio" }
ufmt = "0.2"
embassy-sync = "0.8"

# Chip drivers (drivers/, uradio until Oct 13, 2026), then the digital modes (digimodes/, folded in from udigimodes
# on Oct 23, 2026).
uradio-bus = { path = "drivers/bus" }
bk4829 = { path = "drivers/bk4829" }
si4732 = { path = "drivers/si4732" }
st7789 = { path = "drivers/st7789" }
w25q = { path = "drivers/w25q", default-features = false } # read only unless a crate asks for "write"
keypad = { path = "drivers/keypad" }
uafsk = { path = "digimodes/uafsk" }
upocsag = { path = "digimodes/upocsag" }
udsp = { path = "digimodes/udsp" }
udsc = { path = "digimodes/udsc" }
uaprs = { path = "digimodes/uaprs", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"       # the radio target's rustflags add -Cpanic=immediate-abort after this, which wins
debug = true          # symbols only; not in the flashed image

# The web simulator (`cargo simweb`): release without debug info, stripped.
[profile.wasm]
inherits = "release"
debug = false
strip = true

[profile.test]
opt-level = 1

[workspace.lints.clippy]
# The drawing calls take position, text, font and two colours; register constants spell out bit 0 shifts; the
# fault paths halt in an empty loop on purpose (interrupts off, safe state set).
too_many_arguments = "allow"
new_without_default = "allow"
identity_op = "allow"
empty_loop = "allow"
